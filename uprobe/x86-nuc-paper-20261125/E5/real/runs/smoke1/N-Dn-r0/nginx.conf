user nobody nogroup;
worker_processes 1;
master_process on;
daemon off;
pid runs/smoke1/N-Dn-r0/nginx.pid;
error_log runs/smoke1/N-Dn-r0/error.log notice;
events { worker_connections 256; }
http {
    access_log runs/smoke1/N-Dn-r0/access.log;
    server {
        listen 127.0.0.1:14443 ssl;
        ssl_certificate /home/y/src/bpftime-x86-runs/paper-20261124/harness/test.cer;
        ssl_certificate_key /home/y/src/bpftime-x86-runs/paper-20261124/harness/test.key;
        location / { return 200 "e5\n"; }
    }
}
