# I1: Redis as the TLS server (io-threads 4), same certificate as nginx.conf (test.cer / test.key), TLS only on 6380.
# Foreground, no persistence; the log goes to stdout (the harness redirects it to /bench/error.log).
# io-threads N = the main thread + N-1 threads named io_thd_<i>; io-threads-do-reads: reads and parsing in them too.
bind 127.0.0.1
protected-mode no
port 0
tls-port 6380
tls-cert-file /bench/test.cer
tls-key-file /bench/test.key
tls-auth-clients no
daemonize no
supervised no
logfile ""
loglevel notice
save ""
appendonly no
dir /tmp
databases 1
io-threads 4
io-threads-do-reads yes
