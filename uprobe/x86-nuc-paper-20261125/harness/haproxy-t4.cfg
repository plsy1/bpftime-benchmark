# E7: HAProxy as the TLS server (nbthread 4), same port, certificate and payload file as nginx.conf.
# Access log on stdout (the harness redirects it to /bench/access.log) in nginx's "paper" column order: status, bytes
# sent, bytes sent (HAProxy has no body-only byte count). Stats socket for CumReq (cross-check of dropped log lines).
global
    nbthread 4
    cpu-map 1/1 2
    cpu-map 1/2 3
    cpu-map 1/3 6
    cpu-map 1/4 7
    log stdout format raw local0
    stats socket /bench/haproxy.sock mode 600 level admin
    tune.ssl.default-dh-param 2048
defaults
    mode http
    log global
    log-format "%ST %B %B"
    option http-keep-alive
    timeout client 30s
    timeout connect 5s
    timeout server 30s
frontend tls
    bind 127.0.0.1:4043 ssl crt /bench/haproxy.pem
    http-request return status 200 content-type application/octet-stream file /bench/index.html
