name: Build Prebuilt

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Runner architecture
        type: choice
        options: [both, arm64, x64]
        default: both
      ref:
        description: bpftime code ref to build (branch/tag/sha of this repo)
        default: codex/official-no-btf
      suites:
        description: "Benchmark targets to build: ssl-nginx,uprobe,syscall,syscount,mpk"
        default: ssl-nginx,uprobe,syscall,syscount

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["arm64","x64"]' || format('["{0}"]', inputs.arch)) }}
    name: build ${{ matrix.arch }} @ ${{ inputs.ref }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      CLANG: clang-15
      LD_LIBRARY_PATH: /usr/lib/llvm-15/lib

    steps:
      - name: checkout bpftime code (${{ inputs.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: "recursive"
          path: bpftime

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake binutils-dev build-essential ca-certificates \
            clang clang-15 cmake curl git libboost-all-dev libcrypt-dev \
            libelf-dev libfuse-dev libncurses-dev libpcre2-dev libssl-dev \
            libtool libyaml-cpp-dev llvm llvm-dev llvm-15 llvm-15-dev \
            nginx pkg-config python-is-python3 python3 python3-matplotlib \
            python3-numpy python3-pip systemtap-sdt-dev wrk zlib1g-dev zstd
          llvm-config-15 --version

      - name: build (all selected benchmark targets, no benchmark run)
        working-directory: bpftime
        run: |
          set -euxo pipefail
          suites=",$(echo '${{ inputs.suites }}' | tr -d ' '),"
          has() { [[ "$suites" == *",$1,"* ]] && echo 1 || echo 0; }
          export RUN_SSL_NGINX="$(has ssl-nginx)"
          export RUN_UPROBE="$(has uprobe)"
          export RUN_SYSCALL="$(has syscall)"
          export RUN_SYSCOUNT="$(has syscount)"
          export RUN_MPK="$(has mpk)"

          BUILD_ATTACH_IMPL_EXAMPLE=0
          if [[ "$RUN_SYSCOUNT" == "1" || "$RUN_SSL_NGINX" == "1" ]]; then
            BUILD_ATTACH_IMPL_EXAMPLE=1
          fi

          LLVM_DIR="$(llvm-config-15 --cmakedir)"
          cmake -Bbuild \
            -DLLVM_DIR="$LLVM_DIR" \
            -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
            -DBPFTIME_LLVM_JIT=1 \
            -DBPFTIME_ENABLE_LTO=1 \
            -DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_INFO \
            -DENABLE_PROBE_WRITE_CHECK=1 \
            -DENABLE_PROBE_READ_CHECK=1 \
            -DBPFTIME_ENABLE_MPK=0 \
            -DBUILD_ATTACH_IMPL_EXAMPLE="$BUILD_ATTACH_IMPL_EXAMPLE"
          cmake --build build --config RelWithDebInfo --target install -j"$(nproc)"

          if [[ "$BUILD_ATTACH_IMPL_EXAMPLE" == "1" ]]; then
            cmake --build build --config RelWithDebInfo \
              --target attach_impl_example_nginx -j"$(nproc)" || true
          fi
          if [[ "$RUN_UPROBE" == "1" || "$RUN_MPK" == "1" ]]; then
            make -C benchmark test
          fi
          if [[ "$RUN_UPROBE" == "1" ]]; then
            make -C benchmark/uprobe
          fi
          if [[ "$RUN_SYSCALL" == "1" ]]; then
            make -C benchmark/syscall
          fi
          if [[ "$RUN_SYSCOUNT" == "1" ]]; then
            make -C benchmark/syscount-nginx
          fi
          if [[ "$RUN_SSL_NGINX" == "1" ]]; then
            make -C benchmark/ssl-nginx
          fi

          if [[ "$RUN_MPK" == "1" ]]; then
            cmake -Bbuild-mpk \
              -DLLVM_DIR="$LLVM_DIR" \
              -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
              -DBPFTIME_LLVM_JIT=1 \
              -DBPFTIME_ENABLE_LTO=1 \
              -DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_INFO \
              -DENABLE_PROBE_WRITE_CHECK=1 \
              -DENABLE_PROBE_READ_CHECK=1 \
              -DBPFTIME_ENABLE_MPK=1 \
              -DBUILD_ATTACH_IMPL_EXAMPLE=0
            cmake --build build-mpk --config RelWithDebInfo \
              --target install -j"$(nproc)"
          fi

          if [[ ! -e example/sslsniff && -d example/tracing/sslsniff ]]; then
            ln -s tracing/sslsniff example/sslsniff
          fi
          if [[ ! -e example/libbpf-tools/syscount/syscount \
                && -e example/tracing/syscount/syscount ]]; then
            mkdir -p example/libbpf-tools/syscount
            ln -s ../../tracing/syscount/syscount \
              example/libbpf-tools/syscount/syscount
          fi

      - name: pack built tree
        run: |
          set -euxo pipefail
          git -C bpftime rev-parse HEAD > bpftime/PREBUILT_COMMIT
          echo "${{ inputs.ref }}" >> bpftime/PREBUILT_COMMIT
          date -Is >> bpftime/PREBUILT_COMMIT
          tar -I 'zstd -T0 -8' -cf bpftime-prebuilt.tar.zst \
            --exclude='bpftime/.git' \
            --exclude='*/CMakeFiles' \
            bpftime
          ls -lh bpftime-prebuilt.tar.zst

      - name: upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpftime-prebuilt-${{ matrix.arch }}
          path: bpftime-prebuilt.tar.zst
          retention-days: 30
          compression-level: 0

      - name: summary
        run: |
          {
            echo "## prebuilt ${{ matrix.arch }} @ \`${{ inputs.ref }}\`"
            echo '- commit: `'"$(head -1 bpftime/PREBUILT_COMMIT)"'`'
            echo "- suites built: ${{ inputs.suites }}"
            echo "- archive: $(ls -lh bpftime-prebuilt.tar.zst | awk '{print $5}')"
            echo "- use it: run the Benchmark workflow with prebuilt_run_id = ${{ github.run_id }} (or 'latest')"
          } >> "$GITHUB_STEP_SUMMARY"
