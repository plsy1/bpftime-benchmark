name: Build Jetson No-BTF Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: bpftime source ref (branch, tag, or full SHA)
        default: codex/official-no-btf

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build arm64 image @ ${{ inputs.ref }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout bpftime source (${{ inputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: plsy1/bpftime-benchmark
          ref: ${{ inputs.ref }}
          submodules: recursive
          path: bpftime

      - name: resolve source revision
        id: source
        working-directory: bpftime
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: bpftime
          file: bpftime/Dockerfile.jetson-no-btf
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bpftime:jetson-no-btf-arm64
            ghcr.io/${{ github.repository_owner }}/bpftime:jetson-no-btf-arm64-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: summary
        run: |
          {
            echo "## Jetson No-BTF image"
            echo "- source ref: \`${{ inputs.ref }}\`"
            echo "- source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- tag: \`ghcr.io/${{ github.repository_owner }}/bpftime:jetson-no-btf-arm64\`"
            echo "- immutable tag: \`ghcr.io/${{ github.repository_owner }}/bpftime:jetson-no-btf-arm64-${{ steps.source.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
