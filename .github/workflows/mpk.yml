name: mpk
# MPK is an x86-only feature
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Runner architecture
        type: choice
        options: [both, arm64, x64]
        default: x64
      ref:
        description: bpftime code ref (branch/tag/full sha of this repo)
        default: codex/official-no-btf
      iter:
        description: "benchmark.py --iter (empty = script default 10)"
        default: ""
      prebuilt_run_id:
        description: "Build Prebuilt run id, or 'latest' (empty = build from source)"
        default: ""

permissions:
  contents: write # bench-core pushes result charts to the ci-assets branch
  actions: read

jobs:
  bench:
    uses: ./.github/workflows/bench-core.yml
    with:
      suite: mpk
      arch: ${{ inputs.arch }}
      ref: ${{ inputs.ref }}
      iter: ${{ inputs.iter }}
      prebuilt_run_id: ${{ inputs.prebuilt_run_id }}
