name: bench-core

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string # ssl-nginx | uprobe | syscall | syscount | mpk
      arch:
        type: string
        default: both
      ref:
        type: string
        default: codex/official-no-btf
      ssl_sizes:
        type: string
        default: 16b,1kb,2kb,4kb,16kb,128kb,256kb
      ssl_num_runs:
        type: string
        default: "10"
      wrk_params:
        type: string
        default: "10,100"
      iter:
        type: string
        default: ""
      prebuilt_run_id:
        type: string
        default: ""

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["arm64","x64"]' || format('["{0}"]', inputs.arch)) }}
    name: ${{ inputs.suite }} / ${{ matrix.arch }} / ${{ inputs.ref }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      CLANG: clang-15
      LD_LIBRARY_PATH: /usr/lib/llvm-15/lib

    steps:
      - name: checkout bpftime code (${{ inputs.ref }})
        if: ${{ inputs.prebuilt_run_id == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: "recursive"
          path: bpftime

      - name: resolve prebuilt run
        if: ${{ inputs.prebuilt_run_id != '' }}
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid='${{ inputs.prebuilt_run_id }}'
          if [ "$rid" = "latest" ]; then
            rid="$(gh run list -R "$GITHUB_REPOSITORY" \
              --workflow build-prebuilt.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          { [ -n "$rid" ] && [ "$rid" != "null" ]; } \
            || { echo "no successful Build Prebuilt run found"; exit 1; }
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"

      - name: download prebuilt tree
        if: ${{ inputs.prebuilt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: bpftime-prebuilt-${{ matrix.arch }}
          run-id: ${{ steps.prebuilt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: unpack prebuilt tree
        if: ${{ inputs.prebuilt_run_id != '' }}
        run: |
          sudo apt-get install -y zstd >/dev/null 2>&1 || true
          tar -I zstd -xf bpftime-prebuilt.tar.zst
          echo "prebuilt from:"; cat bpftime/PREBUILT_COMMIT
          echo "::notice::running on the prebuilt tree ($(head -1 bpftime/PREBUILT_COMMIT)); the ref input is not used"

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake binutils-dev build-essential ca-certificates \
            clang clang-15 cmake curl git libboost-all-dev libcrypt-dev \
            libelf-dev libfuse-dev libncurses-dev libpcre2-dev libssl-dev \
            libtool libyaml-cpp-dev \
            llvm llvm-dev llvm-15 llvm-15-dev nginx pkg-config \
            python-is-python3 python3 python3-matplotlib python3-numpy python3-pip \
            systemtap-sdt-dev wrk zlib1g-dev zstd
          llvm-config-15 --version

      - name: build with repository Makefile
        if: ${{ inputs.prebuilt_run_id == '' }}
        working-directory: bpftime
        run: |
          set -euxo pipefail
          make benchmark \
            SKIP_TESTS="deepflow fuse gpu redis-durability-tuning"

          if [ ! -e example/sslsniff ] && [ -d example/tracing/sslsniff ]; then
            ln -sf tracing/sslsniff example/sslsniff
          fi
          if [ ! -e example/libbpf-tools/syscount/syscount ] \
             && [ -e example/tracing/syscount/syscount ]; then
            mkdir -p example/libbpf-tools/syscount
            ln -sf ../../tracing/syscount/syscount \
              example/libbpf-tools/syscount/syscount
          fi

      - name: run benchmark
        run: |
          set -euxo pipefail
          SUITE='${{ inputs.suite }}'

          export SSL_NGINX_SIZES="${{ inputs.ssl_sizes }}"
          export SSL_NGINX_NUM_RUNS="${{ inputs.ssl_num_runs }}"
          IFS=, read -r wrk_dur wrk_conn <<< "${{ inputs.wrk_params }}"
          export SSL_NGINX_WRK_DURATION="${wrk_dur:-10}"
          export SSL_NGINX_WRK_CONNECTIONS="${wrk_conn:-100}"
          iter_args=()
          [ -z "${{ inputs.iter }}" ] || iter_args=(--iter "${{ inputs.iter }}")

          OUT="$GITHUB_WORKSPACE/results-${{ matrix.arch }}"
          mkdir -p "$OUT"
          MARKER="$(mktemp)"

          case "$SUITE" in
            ssl-nginx) cmd=(python3 benchmark/ssl-nginx/draw_figture.py) ;;
            uprobe)    cmd=(python3 benchmark/uprobe/benchmark.py "${iter_args[@]}") ;;
            syscall)   cmd=(python3 benchmark/syscall/benchmark.py) ;;
            syscount)  cmd=(python3 benchmark/syscount-nginx/benchmark.py) ;;
            mpk)       cmd=(python3 benchmark/mpk/benchmark.py "${iter_args[@]}") ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac

          rc=0
          ( cd bpftime && PYTHONUNBUFFERED=1 "${cmd[@]}" ) 2>&1 \
            | tee -a "$OUT/run.log" || rc=1

          dir="$SUITE"; [ "$SUITE" = "syscount" ] && dir=syscount-nginx
          find "bpftime/benchmark/$dir" -maxdepth 3 -type f \
            \( -name '*.json' -o -name '*.txt' -o -name '*.csv' \
               -o -name '*.png' -o -name '*.log' -o -name '*.md' \) \
            -newer "$MARKER" ! -name "access.log" -print0 2>/dev/null \
          | while IFS= read -r -d '' f; do
              rel="${f#bpftime/}"
              mkdir -p "$OUT/files/$(dirname "$rel")"
              cp -a "$f" "$OUT/files/$rel"
            done

          # uprobe/benchmark.py always generates the Markdown report after a
          # successful run. Treat a missing report as an incomplete result
          # instead of publishing a green job with only logs.
          if [ "$SUITE" = "uprobe" ] \
             && [ ! -s "$OUT/files/benchmark/uprobe/results.md" ]; then
            echo "SUITE-FAILED: benchmark/uprobe/results.md was not collected" \
              | tee -a "$OUT/run.log"
            rc=1
          fi

          tar -czf "$OUT.tar.gz" -C "$(dirname "$OUT")" "$(basename "$OUT")" || true
          exit "$rc"

      - name: show run log tail
        if: always()
        run: tail -50 "results-${{ matrix.arch }}/run.log" || true

      - name: publish results to job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          OUT="results-${{ matrix.arch }}"
          [ -d "$OUT" ] || exit 0

          # The uprobe benchmark already produces a complete Markdown report.
          # Keep its job summary focused by publishing only that report; the
          # run log and other collected files remain available in the artifact.
          if [ "${{ inputs.suite }}" = "uprobe" ]; then
            REPORT="$OUT/files/benchmark/uprobe/results.md"
            [ -s "$REPORT" ] || exit 0
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Push small result charts to the ci-assets branch so the summary
          # can hot-link them (GitHub strips data: URIs from summaries).
          ASSET_DIR="runs/${{ github.run_id }}/${{ matrix.arch }}"
          if [ "${{ inputs.suite }}" = "ssl-nginx" ]; then
            mapfile -t pngs < <(
              find "$OUT/files/benchmark/ssl-nginx" -type f \
                -name 'absolute_performance*.png' -size -300k \
                -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -1 | cut -d' ' -f2-
            )
          else
            mapfile -t pngs < <(
              find "$OUT" -name '*.png' -size -300k | sort | head -3
            )
          fi
          urls=()
          if [ "${#pngs[@]}" -gt 0 ]; then
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if ! git clone -q --depth 1 -b ci-assets "$REPO_URL" assets 2>/dev/null; then
              git init -q -b ci-assets assets
              git -C assets remote add origin "$REPO_URL"
            fi
            mkdir -p "assets/$ASSET_DIR"
            for img in "${pngs[@]}"; do
              cp "$img" "assets/$ASSET_DIR/$(basename "$img")"
              urls+=("https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-assets/$ASSET_DIR/$(basename "$img")|${img#"$OUT"/}")
            done
            git -C assets add -A
            git -C assets -c user.name=github-actions \
              -c user.email=github-actions@github.com \
              commit -q -m "charts for run ${{ github.run_id }} (${{ matrix.arch }})"
            for i in 1 2 3 4 5; do
              git -C assets push -q origin ci-assets && break
              git -C assets pull -q --rebase origin ci-assets || true
              sleep 3
            done
          fi

          # ssl-nginx produces a timestamp-matched JSON/TXT result pair and
          # one absolute-performance chart. Keep the summary limited to those
          # final outputs instead of rendering intermediate per-size results.
          if [ "${{ inputs.suite }}" = "ssl-nginx" ]; then
            REPORT="$(
              find "$OUT/files/benchmark/ssl-nginx" -type f \
                -name 'size_benchmark_*.txt' -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -1 | cut -d' ' -f2-
            )"
            [ -n "$REPORT" ] && [ -s "$REPORT" ] || exit 0
            JSON_REPORT="${REPORT%.txt}.json"
            {
              echo '```text'
              head -20 "$REPORT"
              echo '```'
              echo

              if [ -s "$JSON_REPORT" ]; then
                echo "<details><summary><b>$(basename "$JSON_REPORT")</b></summary>"
                echo
                echo '```json'
                cat "$JSON_REPORT"
                echo
                echo '```'
                echo "</details>"
                echo
              fi

              for entry in ${urls[@]+"${urls[@]}"}; do
                echo "![](${entry%%|*})"
                echo
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ${{ inputs.suite }} — ${{ matrix.arch }} @ \`${{ inputs.ref }}\`"
            echo
            grep -h "SUITE-FAILED" "$OUT/run.log" 2>/dev/null || true
            echo

            # Render every collected result file (bounded to stay under the
            # 1MiB step-summary limit; full files land in the artifact).
            # Markdown reports are emitted as Markdown so their tables render
            # in the job summary instead of appearing as a code block.
            budget=800000
            found=0
            while IFS= read -r f; do
              sz=$(stat -c%s "$f")
              case "$f" in
                *.json) [ "$sz" -le 4096 ] || continue ;;
              esac
              found=1
              if [ "$budget" -le 0 ]; then continue; fi
              budget=$((budget - (sz > 20000 ? 20000 : sz)))
              echo "<details open><summary><b>${f#"$OUT"/files/}</b> (${sz} bytes)</summary>"
              echo
              if [[ "$f" = *.md ]]; then
                head -200 "$f"
                [ "$(wc -l < "$f")" -le 200 ] \
                  || echo "_... truncated; full report is in the artifact_"
              else
                echo '```'
                head -60 "$f"
                [ "$(wc -l < "$f")" -le 60 ] \
                  || echo "... (truncated; full file in the artifact)"
                echo '```'
              fi
              echo "</details>"
              echo
            done < <(find "$OUT/files" -type f \
                       \( -name '*.txt' -o -name '*.csv' -o -name '*.json' \
                          -o -name '*.md' \) 2>/dev/null | sort)
            [ "$budget" -gt 0 ] || echo "_summary size budget reached; remaining files are in the artifact_"
            [ "$found" = "1" ] || echo "_this suite produced no result files; its output is in the run log below_"
            echo

            echo "<details><summary><b>run.log (tail)</b></summary>"
            echo
            echo '```'
            tail -80 "$OUT/run.log" 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo

            for entry in ${urls[@]+"${urls[@]}"}; do
              echo "### ${entry#*|}"
              echo "![](${entry%%|*})"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            results-${{ matrix.arch }}.tar.gz
            results-${{ matrix.arch }}/run.log
            results-${{ matrix.arch }}/files/**/*.md
          if-no-files-found: warn
