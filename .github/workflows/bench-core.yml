name: bench-core

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string # ssl-nginx | uprobe | syscall | syscount | mpk
      arch:
        type: string
        default: both
      ref:
        type: string
        default: codex/official-no-btf
      ssl_sizes:
        type: string
        default: 16b,1kb,2kb,4kb,16kb,128kb,256kb
      ssl_num_runs:
        type: string
        default: "10"
      wrk_params:
        type: string
        default: "10,100"
      iter:
        type: string
        default: ""
      prebuilt_run_id:
        type: string
        default: ""

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["arm64","x64"]' || format('["{0}"]', inputs.arch)) }}
    name: ${{ inputs.suite }} / ${{ matrix.arch }} / ${{ inputs.ref }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      CLANG: clang-15
      LD_LIBRARY_PATH: /usr/lib/llvm-15/lib

    steps:
      - name: checkout bpftime code (${{ inputs.ref }})
        if: ${{ inputs.prebuilt_run_id == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: "recursive"
          path: bpftime

      - name: resolve prebuilt run
        if: ${{ inputs.prebuilt_run_id != '' }}
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid='${{ inputs.prebuilt_run_id }}'
          if [ "$rid" = "latest" ]; then
            rid="$(gh run list -R "$GITHUB_REPOSITORY" \
              --workflow build-prebuilt.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          { [ -n "$rid" ] && [ "$rid" != "null" ]; } \
            || { echo "no successful Build Prebuilt run found"; exit 1; }
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"

      - name: download prebuilt tree
        if: ${{ inputs.prebuilt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: bpftime-prebuilt-${{ matrix.arch }}
          run-id: ${{ steps.prebuilt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: unpack prebuilt tree
        if: ${{ inputs.prebuilt_run_id != '' }}
        run: |
          sudo apt-get install -y zstd >/dev/null 2>&1 || true
          tar -I zstd -xf bpftime-prebuilt.tar.zst
          echo "prebuilt from:"; cat bpftime/PREBUILT_COMMIT

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake binutils-dev build-essential ca-certificates \
            clang clang-15 cmake curl git libboost-all-dev libelf-dev \
            libncurses-dev libssl-dev libtool libyaml-cpp-dev \
            llvm llvm-dev llvm-15 llvm-15-dev nginx pkg-config \
            python-is-python3 python3 python3-matplotlib python3-numpy \
            systemtap-sdt-dev wrk zlib1g-dev zstd
          llvm-config-15 --version

      - name: build
        if: ${{ inputs.prebuilt_run_id == '' }}
        working-directory: bpftime
        run: |
          set -euxo pipefail
          SUITE='${{ inputs.suite }}'

          LLVM_DIR="$(llvm-config-15 --cmakedir)"
          cmake -Bbuild \
            -DLLVM_DIR="$LLVM_DIR" \
            -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
            -DBPFTIME_LLVM_JIT=1 \
            -DBPFTIME_ENABLE_LTO=1 \
            -DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_INFO \
            -DENABLE_PROBE_WRITE_CHECK=1 \
            -DENABLE_PROBE_READ_CHECK=1 \
            -DBUILD_ATTACH_IMPL_EXAMPLE=1
          cmake --build build --config RelWithDebInfo --target install -j"$(nproc)"
          cmake --build build --config RelWithDebInfo --target attach_impl_example_nginx -j"$(nproc)" || true

          case "$SUITE" in
            ssl-nginx)
              make -C benchmark/ssl-nginx
              if [ ! -e example/sslsniff ] && [ -d example/tracing/sslsniff ]; then
                ln -sf tracing/sslsniff example/sslsniff
              fi
              ;;
            uprobe)
              make -C benchmark test
              make -C benchmark/uprobe
              ;;
            syscall)
              make -C benchmark/syscall
              ;;
            syscount)
              make -C benchmark/syscount-nginx
              if [ ! -e example/libbpf-tools/syscount/syscount ] \
                 && [ -e example/tracing/syscount/syscount ]; then
                mkdir -p example/libbpf-tools/syscount
                ln -sf ../../tracing/syscount/syscount example/libbpf-tools/syscount/syscount
              fi
              ;;
            mpk)
              make -C benchmark test
              cmake -Bbuild-mpk -DLLVM_DIR="$LLVM_DIR" \
                -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
                -DBPFTIME_LLVM_JIT=1 -DBPFTIME_ENABLE_MPK=1
              cmake --build build-mpk --config RelWithDebInfo -j"$(nproc)" || true
              ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac

      - name: run benchmark
        run: |
          set -euxo pipefail
          SUITE='${{ inputs.suite }}'

          export SSL_NGINX_SIZES="${{ inputs.ssl_sizes }}"
          export SSL_NGINX_NUM_RUNS="${{ inputs.ssl_num_runs }}"
          IFS=, read -r wrk_dur wrk_conn <<< "${{ inputs.wrk_params }}"
          export SSL_NGINX_WRK_DURATION="${wrk_dur:-10}"
          export SSL_NGINX_WRK_CONNECTIONS="${wrk_conn:-100}"
          iter_args=()
          [ -z "${{ inputs.iter }}" ] || iter_args=(--iter "${{ inputs.iter }}")

          OUT="$GITHUB_WORKSPACE/results-${{ matrix.arch }}"
          mkdir -p "$OUT"
          MARKER="$(mktemp)"

          case "$SUITE" in
            ssl-nginx) cmd=(python3 benchmark/ssl-nginx/draw_figture.py) ;;
            uprobe)    cmd=(python3 benchmark/uprobe/benchmark.py "${iter_args[@]}") ;;
            syscall)   cmd=(python3 benchmark/syscall/benchmark.py) ;;
            syscount)  cmd=(python3 benchmark/syscount-nginx/benchmark.py) ;;
            mpk)       cmd=(python3 benchmark/mpk/benchmark.py "${iter_args[@]}") ;;
            *) echo "unknown suite: $SUITE" >&2; exit 1 ;;
          esac

          rc=0
          ( cd bpftime && PYTHONUNBUFFERED=1 "${cmd[@]}" ) 2>&1 \
            | tee -a "$OUT/run.log" || rc=1

          dir="$SUITE"; [ "$SUITE" = "syscount" ] && dir=syscount-nginx
          find "bpftime/benchmark/$dir" -maxdepth 3 -type f \
            \( -name '*.json' -o -name '*.txt' -o -name '*.csv' \
               -o -name '*.png' -o -name '*.log' \) \
            -newer "$MARKER" ! -name "access.log" -print0 2>/dev/null \
          | while IFS= read -r -d '' f; do
              rel="${f#bpftime/}"
              mkdir -p "$OUT/files/$(dirname "$rel")"
              cp -a "$f" "$OUT/files/$rel"
            done
          tar -czf "$OUT.tar.gz" -C "$(dirname "$OUT")" "$(basename "$OUT")" || true
          exit "$rc"

      - name: show run log tail
        if: always()
        run: tail -50 "results-${{ matrix.arch }}/run.log" || true

      - name: publish results to job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          OUT="results-${{ matrix.arch }}"
          [ -d "$OUT" ] || exit 0

          # Push small result charts to the ci-assets branch so the summary
          # can hot-link them (GitHub strips data: URIs from summaries).
          ASSET_DIR="runs/${{ github.run_id }}/${{ matrix.arch }}"
          mapfile -t pngs < <(find "$OUT" -name '*.png' -size -300k | sort | head -3)
          urls=()
          if [ "${#pngs[@]}" -gt 0 ]; then
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if ! git clone -q --depth 1 -b ci-assets "$REPO_URL" assets 2>/dev/null; then
              git init -q -b ci-assets assets
              git -C assets remote add origin "$REPO_URL"
            fi
            mkdir -p "assets/$ASSET_DIR"
            for img in "${pngs[@]}"; do
              cp "$img" "assets/$ASSET_DIR/$(basename "$img")"
              urls+=("https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-assets/$ASSET_DIR/$(basename "$img")|${img#"$OUT"/}")
            done
            git -C assets add -A
            git -C assets -c user.name=github-actions \
              -c user.email=github-actions@github.com \
              commit -q -m "charts for run ${{ github.run_id }} (${{ matrix.arch }})"
            for i in 1 2 3 4 5; do
              git -C assets push -q origin ci-assets && break
              git -C assets pull -q --rebase origin ci-assets || true
              sleep 3
            done
          fi

          {
            echo "## ${{ inputs.suite }} — ${{ matrix.arch }} @ \`${{ inputs.ref }}\`"
            echo

            # first ~20 lines of each result txt (summary tables live at the top)
            find "$OUT" -name 'size_benchmark_*.txt' -o -name '*results*.txt' \
              | sort | head -8 | while IFS= read -r f; do
              echo "<details open><summary><b>${f#"$OUT"/}</b></summary>"
              echo
              echo '```'
              head -20 "$f"
              echo '```'
              echo "</details>"
              echo
            done

            for entry in ${urls[@]+"${urls[@]}"}; do
              echo "### ${entry#*|}"
              echo "![](${entry%%|*})"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            results-${{ matrix.arch }}.tar.gz
            results-${{ matrix.arch }}/run.log
          if-no-files-found: warn
