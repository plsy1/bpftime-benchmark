name: Benchmark

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Runner architecture
        type: choice
        options: [both, arm64, x64]
        default: both
      ref:
        description: bpftime code ref to benchmark (branch/tag/sha of this repo)
        default: codex/official-no-btf
      suites:
        description: "Comma list: ssl-nginx,uprobe,syscall,syscount,mpk"
        default: ssl-nginx
      mode:
        description: full or smoke (smoke shrinks every suite)
        type: choice
        options: [full, smoke]
        default: full
      ssl_sizes:
        description: Comma-separated ssl-nginx payload sizes
        default: 16b,1kb,2kb,4kb,16kb,128kb,256kb
      ssl_num_runs:
        description: ssl-nginx wrk repetitions per mode
        default: "10"
      wrk_params:
        description: "ssl-nginx wrk duration_s,connections"
        default: "10,100"
      uprobe_iters:
        description: "uprobe outer,inner iterations (empty = suite default)"
        default: ""
      prebuilt_run_id:
        description: "Build Prebuilt run id, or 'latest' (empty = build from source)"
        default: ""

permissions:
  contents: write # push result charts to the ci-assets branch
  actions: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["arm64","x64"]' || format('["{0}"]', inputs.arch)) }}
    name: ${{ matrix.arch }} / ${{ inputs.suites }} / ${{ inputs.ref }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      CLANG: clang-15
      LD_LIBRARY_PATH: /usr/lib/llvm-15/lib

    steps:
      - name: checkout harness (this branch)
        uses: actions/checkout@v4
        with:
          path: harness

      - name: checkout bpftime code (${{ inputs.ref }})
        if: ${{ inputs.prebuilt_run_id == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: "recursive"
          path: bpftime

      - name: resolve prebuilt run
        if: ${{ inputs.prebuilt_run_id != '' }}
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid='${{ inputs.prebuilt_run_id }}'
          if [ "$rid" = "latest" ]; then
            rid="$(gh run list -R "$GITHUB_REPOSITORY" \
              --workflow build-prebuilt.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          { [ -n "$rid" ] && [ "$rid" != "null" ]; } \
            || { echo "no successful Build Prebuilt run found"; exit 1; }
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"

      - name: download prebuilt tree
        if: ${{ inputs.prebuilt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: bpftime-prebuilt-${{ matrix.arch }}
          run-id: ${{ steps.prebuilt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: unpack prebuilt tree
        if: ${{ inputs.prebuilt_run_id != '' }}
        run: |
          sudo apt-get install -y zstd >/dev/null 2>&1 || true
          tar -I zstd -xf bpftime-prebuilt.tar.zst
          echo "prebuilt from:"; cat bpftime/PREBUILT_COMMIT

      - name: install LLVM 15 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-15 llvm-15 llvm-15-dev
          llvm-config-15 --version

      - name: run benchmarks
        run: |
          set -euxo pipefail

          # suites -> RUN_* switches for the orchestrator
          suites=",$(echo '${{ inputs.suites }}' | tr -d ' '),"
          has() { [[ "$suites" == *",$1,"* ]] && echo 1 || echo 0; }
          export RUN_SSL_NGINX="$(has ssl-nginx)"
          export RUN_UPROBE="$(has uprobe)"
          export RUN_SYSCALL="$(has syscall)"
          export RUN_SYSCOUNT="$(has syscount)"
          export RUN_MPK="$(has mpk)"

          # ssl-nginx load parameters (consumed by benchmark.py on the code ref)
          IFS=, read -r wrk_dur wrk_conn <<< "${{ inputs.wrk_params }}"
          export SSL_NGINX_NUM_RUNS="${{ inputs.ssl_num_runs }}"
          export SSL_NGINX_WRK_DURATION="${wrk_dur:-10}"
          export SSL_NGINX_WRK_CONNECTIONS="${wrk_conn:-100}"

          extra_args=()
          if [[ -n "${{ inputs.uprobe_iters }}" ]]; then
            IFS=, read -r up_outer up_inner <<< "${{ inputs.uprobe_iters }}"
            [[ -n "${up_outer:-}" ]] && extra_args+=(--uprobe-iter "$up_outer")
            [[ -n "${up_inner:-}" ]] && extra_args+=(--uprobe-test-iter "$up_inner")
          fi

          export SSL_NGINX_SIZES="${{ inputs.ssl_sizes }}"

          # deps + build via the orchestrator; measurement of ssl-nginx runs
          # draw_figture.py directly so its SSL_NGINX_* env parameters apply
          # without an extra layer. Other suites still run via the orchestrator.
          setup_tree() {
            if [ -n "${{ inputs.prebuilt_run_id }}" ]; then
              RUN_UPROBE=0 RUN_SYSCALL=0 RUN_SYSCOUNT=0 RUN_SSL_NGINX=0 RUN_MPK=0 \
                harness/run_bpftime_arm64_benchmarks.sh --install-deps --no-build \
                  --output-dir "$1/.deps-check" "$1" || true
            else
              harness/run_bpftime_arm64_benchmarks.sh --install-deps --build-only \
                --llvm-dir "$(llvm-config-15 --cmakedir)" \
                --output-dir "$1/.build-log" "$1"
            fi
            # historical path expected by benchmark.py
            if [ ! -e "$1/example/sslsniff" ] && [ -d "$1/example/tracing/sslsniff" ]; then
              ln -sf tracing/sslsniff "$1/example/sslsniff"
            fi
          }

          run_one() {
            mkdir -p "$2/files/benchmark/ssl-nginx"
            if [ "$RUN_SSL_NGINX" = "1" ]; then
              ( cd "$1" && PYTHONUNBUFFERED=1 \
                  python3 benchmark/ssl-nginx/draw_figture.py ) 2>&1 \
                | tee -a "$2/run.log"
              cp "$1"/benchmark/ssl-nginx/size_benchmark_* \
                 "$1"/benchmark/ssl-nginx/benchmark_results_* \
                 "$1"/benchmark/ssl-nginx/*.png \
                 "$2/files/benchmark/ssl-nginx/" 2>/dev/null || true
            fi
            if [ "$RUN_UPROBE$RUN_SYSCALL$RUN_SYSCOUNT$RUN_MPK" != "0000" ]; then
              RUN_SSL_NGINX=0 harness/run_bpftime_arm64_benchmarks.sh \
                --no-build --mode "${{ inputs.mode }}" \
                --output-dir "$2-suites" \
                "${extra_args[@]}" \
                "$1" 2>&1 | tee -a "$2/run.log" || true
            fi
            tar -czf "$2.tar.gz" -C "$(dirname "$2")" "$(basename "$2")" || true
          }

          setup_tree "$GITHUB_WORKSPACE/bpftime"
          run_one "$GITHUB_WORKSPACE/bpftime" "$GITHUB_WORKSPACE/results-${{ matrix.arch }}"

      - name: show run log tail
        if: always()
        run: tail -50 "results-${{ matrix.arch }}/run.log" || true

      - name: publish results to job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          OUT="results-${{ matrix.arch }}"
          [ -d "$OUT" ] || exit 0

          # Push small result charts to the ci-assets branch so the summary
          # can hot-link them (GitHub strips data: URIs from summaries).
          ASSET_DIR="runs/${{ github.run_id }}/${{ matrix.arch }}"
          mapfile -t pngs < <(find "$OUT" -name '*.png' -size -300k | sort | head -3)
          urls=()
          if [ "${#pngs[@]}" -gt 0 ]; then
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if ! git clone -q --depth 1 -b ci-assets "$REPO_URL" assets 2>/dev/null; then
              git init -q -b ci-assets assets
              git -C assets remote add origin "$REPO_URL"
            fi
            mkdir -p "assets/$ASSET_DIR"
            for img in "${pngs[@]}"; do
              cp "$img" "assets/$ASSET_DIR/$(basename "$img")"
              urls+=("https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-assets/$ASSET_DIR/$(basename "$img")|${img#"$OUT"/}")
            done
            git -C assets add -A
            git -C assets -c user.name=github-actions \
              -c user.email=github-actions@github.com \
              commit -q -m "charts for run ${{ github.run_id }} (${{ matrix.arch }})"
            for i in 1 2 3 4 5; do
              git -C assets push -q origin ci-assets && break
              git -C assets pull -q --rebase origin ci-assets || true
              sleep 3
            done
          fi

          {
            echo "## ${{ matrix.arch }} — ${{ inputs.suites }} @ \`${{ inputs.ref }}\`"
            echo
            grep -hE "Selected benchmarks|Completed with|failed" "$OUT/run.log" 2>/dev/null | tail -3 || true
            echo

            # first ~20 lines of each result txt (summary tables live at the top)
            find "$OUT" -name 'size_benchmark_*.txt' -o -name '*results*.txt' \
              | sort | head -8 | while IFS= read -r f; do
              echo "<details open><summary><b>${f#"$OUT"/}</b></summary>"
              echo
              echo '```'
              head -20 "$f"
              echo '```'
              echo "</details>"
              echo
            done

            for entry in ${urls[@]+"${urls[@]}"}; do
              echo "### ${entry#*|}"
              echo "![](${entry%%|*})"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            results-${{ matrix.arch }}.tar.gz
            results-${{ matrix.arch }}/run.log
          if-no-files-found: warn
