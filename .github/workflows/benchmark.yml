name: Benchmark

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Runner architecture
        type: choice
        options: [both, arm64, x64]
        default: both
      ref:
        description: bpftime code ref to benchmark (branch/tag/sha of this repo)
        default: codex/official-no-btf
      suites:
        description: "Comma list: ssl-nginx,uprobe,syscall,syscount,mpk"
        default: ssl-nginx
      mode:
        description: full or smoke (smoke shrinks every suite)
        type: choice
        options: [full, smoke]
        default: full
      ssl_sizes:
        description: Comma-separated ssl-nginx payload sizes
        default: 16b,1kb,2kb,4kb,16kb,128kb,256kb
      ssl_num_runs:
        description: ssl-nginx wrk repetitions per mode
        default: "10"
      wrk_params:
        description: "ssl-nginx wrk duration_s,connections"
        default: "10,100"
      uprobe_iters:
        description: "uprobe outer,inner iterations (empty = suite default)"
        default: ""

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["arm64","x64"]' || format('["{0}"]', inputs.arch)) }}
    name: ${{ matrix.arch }} / ${{ inputs.suites }} / ${{ inputs.ref }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      CLANG: clang-15
      LD_LIBRARY_PATH: /usr/lib/llvm-15/lib

    steps:
      - name: checkout harness (this branch)
        uses: actions/checkout@v4
        with:
          path: harness

      - name: checkout bpftime code (${{ inputs.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: "recursive"
          path: bpftime

      - name: install LLVM 15 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-15 llvm-15 llvm-15-dev
          llvm-config-15 --version

      - name: run benchmarks
        run: |
          set -euxo pipefail

          # suites -> RUN_* switches for the orchestrator
          suites=",$(echo '${{ inputs.suites }}' | tr -d ' '),"
          has() { [[ "$suites" == *",$1,"* ]] && echo 1 || echo 0; }
          export RUN_SSL_NGINX="$(has ssl-nginx)"
          export RUN_UPROBE="$(has uprobe)"
          export RUN_SYSCALL="$(has syscall)"
          export RUN_SYSCOUNT="$(has syscount)"
          export RUN_MPK="$(has mpk)"

          # ssl-nginx load parameters (consumed by benchmark.py on the code ref)
          IFS=, read -r wrk_dur wrk_conn <<< "${{ inputs.wrk_params }}"
          export SSL_NGINX_NUM_RUNS="${{ inputs.ssl_num_runs }}"
          export SSL_NGINX_WRK_DURATION="${wrk_dur:-10}"
          export SSL_NGINX_WRK_CONNECTIONS="${wrk_conn:-100}"

          extra_args=()
          if [[ -n "${{ inputs.uprobe_iters }}" ]]; then
            IFS=, read -r up_outer up_inner <<< "${{ inputs.uprobe_iters }}"
            [[ -n "${up_outer:-}" ]] && extra_args+=(--uprobe-iter "$up_outer")
            [[ -n "${up_inner:-}" ]] && extra_args+=(--uprobe-test-iter "$up_inner")
          fi

          harness/run_bpftime_arm64_benchmarks.sh \
            --install-deps \
            --build \
            --mode "${{ inputs.mode }}" \
            --ssl-sizes "${{ inputs.ssl_sizes }}" \
            --llvm-dir "$(llvm-config-15 --cmakedir)" \
            --output-dir "$GITHUB_WORKSPACE/results-${{ matrix.arch }}" \
            "${extra_args[@]}" \
            "$GITHUB_WORKSPACE/bpftime"

      - name: show run log tail
        if: always()
        run: tail -50 "results-${{ matrix.arch }}/run.log" || true

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            results-${{ matrix.arch }}.tar.gz
            results-${{ matrix.arch }}/run.log
          if-no-files-found: warn
